name: Publish Tools
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/tools
      - name: Test
        run: bun run test
        working-directory: packages/tools

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Publish to NPM
        env:
          # OIDC trusted publishing is used automatically once configured on
          # npm; the token is only a fallback for the migration window.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm publish does not rewrite the workspace: protocol, so pack
          # with bun (which does) and publish the resolved tarball instead.
          bun install --lockfile-only --ignore-scripts
          (cd packages/tools && bun pm pack --destination ../../dist)
          npm publish ./dist/*.tgz --access public
