[workspace]
resolver = "2"
members = [
    "crates/factors",
    "crates/indicators",
    "crates/strategies",
    "crates/strategies/proc-macro",
    "crates/codegen",
    "bindings/js",
    "bindings/py",
]

[workspace.dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
napi-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.8"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std"] }
inventory = "0.3"
schemars = { version = "0.8", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
